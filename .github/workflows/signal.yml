# Redraw the contribution chart (assets/matrix/signal.svg) once a day.
name: signal

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/signal.py

      - name: Commit if it changed
        run: |
          git config user.name "signal[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/matrix/signal.svg
          git diff --cached --quiet && exit 0
          git commit -q -m "signal: daily contribution chart"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
