# Escape the Matrix: every issue titled "matrix: <direction>" is one move.
# scripts/escape.py plays it, redraws assets/matrix/escape.svg and prints the reply posted on the issue.
name: escape-the-matrix

on:
  issues:
    types: [opened]

# one move at a time, in order
concurrency:
  group: escape-the-matrix
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  move:
    if: startsWith(github.event.issue.title, 'matrix:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the title and login go in through env vars, never pasted into the script
      - name: Play the move
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: python3 scripts/escape.py move --title "$TITLE" --player "$PLAYER" > "$RUNNER_TEMP/reply.md"

      - name: Commit the new board
        env:
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "escape-the-matrix[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/escape.json assets/matrix/escape.svg
          git diff --cached --quiet && exit 0
          git commit -q -m "escape: move by @${PLAYER//[^A-Za-z0-9-]/}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done

      - name: Answer and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$NUMBER" --reason completed
