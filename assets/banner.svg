<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Gnaneshwar Reddy. AI agents with Claude Code and MCP, a person approves every write.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#121a34"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#4c8dff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .name { font-size: 58px; font-weight: 800; fill: #eef3ff; letter-spacing: -1px; }
      .role { font-size: 22px; fill: #9fb0d4; }
      .hl { fill: #7aa7ff; font-weight: 700; }
      .chip { fill: #141d38; stroke: #2a3a66; }
      .chipt { font-size: 15px; fill: #c9d5f2; font-weight: 600; }
      .node { fill: #111a33; stroke: #2a3a66; stroke-width: 1.5; }
      .nodet { font-size: 17px; fill: #e6edf8; font-weight: 700; }
      .nodes { font-size: 14px; fill: #8b98b5; }
      .wire { stroke: #2f4170; stroke-width: 2; fill: none; }
      .pulse { fill: #4c8dff; }
      .lock { animation: lock 6s infinite; }
      @keyframes lock { 0%, 62% { stroke: #2a3a66; } 70%, 92% { stroke: #f87171; } 100% { stroke: #2a3a66; } }
      .ok { animation: ok 6s infinite; opacity: 0; }
      @keyframes ok { 0%, 70% { opacity: 0; } 76%, 94% { opacity: 1; } 100% { opacity: 0; } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .typed { animation: type 6s infinite; clip-path: inset(0 100% 0 0); }
      @keyframes type { 0%, 45% { clip-path: inset(0 100% 0 0); } 60%, 100% { clip-path: inset(0 0 0 0); } }
      .agent { animation: work 6s infinite; }
      .a2 { animation-delay: .25s; } .a3 { animation-delay: .5s; } .a4 { animation-delay: .75s; }
      @keyframes work { 0%, 8% { stroke: #2a3a66; } 14%, 40% { stroke: #4c8dff; } 46%, 100% { stroke: #2a3a66; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glowA)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glowB)"/>
  <rect x=".75" y=".75" width="1278.5" height="418.5" rx="21.5" fill="none" stroke="#2a3a66"/>

  <!-- left: who -->
  <g class="sans">
    <text x="64" y="92" class="mono" font-size="16" fill="#7aa7ff" letter-spacing="3">@gnaneshwar151120</text>
    <text x="64" y="160" class="name">Gnaneshwar Reddy</text>
    <text x="64" y="202" class="role">I build <tspan class="hl">AI agents</tspan> that do real work in healthcare,</text>
    <text x="64" y="232" class="role">and a person approves <tspan class="hl">every write</tspan>.</text>

    <g transform="translate(64 272)">
      <rect width="196" height="36" rx="18" class="chip"/><text x="98" y="23" text-anchor="middle" class="chipt">Claude Code + MCP</text>
      <rect x="208" width="196" height="36" rx="18" class="chip"/><text x="306" y="23" text-anchor="middle" class="chipt">Prometheus · Grafana</text>
      <rect x="416" width="110" height="36" rx="18" class="chip"/><text x="471" y="23" text-anchor="middle" class="chipt">Puppet</text>
    </g>
    <g transform="translate(64 320)">
      <rect width="196" height="36" rx="18" fill="#2a1d14" stroke="#d97757"/><text x="98" y="23" text-anchor="middle" class="chipt" fill="#f3b9a0">4x Claude Certified</text>
      <rect x="208" width="232" height="36" rx="18" fill="#0f2238" stroke="#0078d4"/><text x="324" y="23" text-anchor="middle" class="chipt" fill="#9cc8f2">3x Microsoft Certified</text>
    </g>
  </g>

  <!-- right: the approval loop -->
  <g class="sans" transform="translate(740 28)">
    <text x="0" y="14" class="mono" font-size="14" fill="#7d8db3" letter-spacing="2">HOW MY AGENTS WORK</text>

    <!-- wires -->
    <path class="wire" d="M120 82 H170"/>
    <path class="wire" d="M300 82 H330"/>
    <path class="wire" d="M240 112 V136"/>
    <path class="wire" d="M325 240 V256 H415 V272"/>
    <path class="wire" d="M60 112 V300 H150"/>

    <!-- pulses travelling the loop -->
    <circle r="4" class="pulse"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.12;1" calcMode="linear" path="M120 82 H170"/></circle>
    <circle r="4" class="pulse"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.12;.4;1" calcMode="linear" path="M240 112 V136"/></circle>
    <circle r="4" fill="#a78bfa"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.4;.48;1" calcMode="linear" path="M325 240 V256 H415 V272"/></circle>
    <circle r="4" fill="#34d399"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.6;.7;1" calcMode="linear" path="M60 112 V300 H150"/></circle>

    <!-- me -->
    <rect x="0" y="52" width="120" height="60" rx="12" class="node" stroke="#a78bfa"/>
    <text x="60" y="78" text-anchor="middle" class="nodet">Me</text>
    <text x="60" y="97" text-anchor="middle" class="nodes">approves</text>

    <!-- manager -->
    <rect x="170" y="52" width="130" height="60" rx="12" class="node"/>
    <text x="235" y="78" text-anchor="middle" class="nodet">Manager</text>
    <text x="235" y="97" text-anchor="middle" class="nodes">plans · routes</text>

    <!-- agents -->
    <rect x="150" y="136" width="350" height="104" rx="14" fill="#0e1630" stroke="#24345e" stroke-dasharray="4 4"/>
    <text x="166" y="157" class="mono" font-size="13" fill="#7d8db3" letter-spacing="1.5">AGENTS · READ-ONLY FIRST</text>
    <rect x="166" y="168" width="104" height="56" rx="10" class="node agent"/><text x="218" y="192" text-anchor="middle" class="nodet" font-size="15">Tester</text><text x="218" y="210" text-anchor="middle" class="nodes">per feature</text>
    <rect x="278" y="168" width="104" height="56" rx="10" class="node agent a2"/><text x="330" y="192" text-anchor="middle" class="nodet" font-size="15">Retester</text><text x="330" y="210" text-anchor="middle" class="nodes">4 roles</text>
    <rect x="390" y="168" width="98" height="56" rx="10" class="node agent a3"/><text x="439" y="192" text-anchor="middle" class="nodet" font-size="15">Flow</text><text x="439" y="210" text-anchor="middle" class="nodes">downstream</text>

    <!-- MCP -->
    <rect x="330" y="52" width="170" height="60" rx="12" class="node"/>
    <text x="415" y="78" text-anchor="middle" class="nodet">MCP servers</text>
    <text x="415" y="97" text-anchor="middle" class="nodes">SELECT-only</text>

    <!-- publish + recorder -->
    <rect x="150" y="272" width="176" height="56" rx="12" fill="#0a0f1e" stroke="#2a3a66"/>
    <text x="166" y="306" class="mono" font-size="18" fill="#34d399">&gt; <tspan class="typed">PUBLISH</tspan><tspan class="caret">▍</tspan></text>
    <rect x="330" y="272" width="170" height="56" rx="12" class="node lock"/>
    <text x="415" y="296" text-anchor="middle" class="nodet">🔒 Recorder</text>
    <text x="415" y="314" text-anchor="middle" class="nodes">only ADO writer</text>

    <g class="ok">
      <rect x="150" y="340" width="350" height="28" rx="14" fill="#0f2a22" stroke="#34d399"/>
      <text x="325" y="359" text-anchor="middle" class="nodes" font-size="14" fill="#7ee2b8">✓ nothing is written without my PUBLISH</text>
    </g>
  </g>
</svg>
