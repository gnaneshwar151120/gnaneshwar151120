<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Let's talk. Find me on LinkedIn: Gnaneshwar Reddy. I post Linux notes on Tuesdays and AI, testing and data on Thursdays.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#141d3c"/></linearGradient>
    <radialGradient id="glow" cx=".88" cy=".1" r=".6"><stop offset="0" stop-color="#4c8dff" stop-opacity=".28"/><stop offset="1" stop-color="#4c8dff" stop-opacity="0"/></radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a66c2"/><stop offset="1" stop-color="#4c8dff"/></linearGradient>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .caret { animation: caret 1s steps(1) infinite; }
      @keyframes caret { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-6px); } }
    </style>
  </defs>
  <rect width="1000" height="230" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="230" rx="22" fill="url(#glow)"/>
  <rect x=".75" y=".75" width="998.5" height="228.5" rx="21.5" fill="none" stroke="#2a3a66"/>

  <g class="sans">
    <text x="48" y="62" class="mono" font-size="14" fill="#7aa7ff" letter-spacing="2">$ ssh gnaneshwar@linkedin<tspan class="caret" fill="#34d399"> ▍</tspan></text>
    <text x="48" y="112" font-size="38" font-weight="800" fill="#eef3ff" letter-spacing="-.5">Let's talk.</text>
    <text x="48" y="146" font-size="17" fill="#9fb0d4">AI agents, infra monitoring, data. Happy to compare notes.</text>
    <text x="48" y="182" class="mono" font-size="13" fill="#6f7fa6">Tue: Linux notes  ·  Thu: AI, testing &amp; data</text>
  </g>

  <!-- button -->
  <g class="float">
    <rect class="pulse" x="636" y="88" width="300" height="64" rx="32" fill="none" stroke="#4c8dff" stroke-width="2"/>
    <rect x="636" y="88" width="300" height="64" rx="32" fill="url(#btn)"/>
    <rect x="662" y="104" width="32" height="32" rx="6" fill="#ffffff"/>
    <text x="678" y="128" text-anchor="middle" class="sans" font-size="21" font-weight="800" fill="#0a66c2">in</text>
    <text x="710" y="127" class="sans" font-size="18" font-weight="700" fill="#ffffff">Gnaneshwar Reddy</text>
    <text x="912" y="127" text-anchor="end" class="sans" font-size="18" font-weight="700" fill="#ffffff">→</text>
  </g>
</svg>
